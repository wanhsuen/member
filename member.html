<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>沐森集團 會員中心</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
         background: #f3f4f1; color: #222; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  h2 { font-size: 17px; margin: 0 0 4px; }
  .hidden { display: none !important; }
  .panel { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  label { display: block; font-size: 14px; margin: 12px 0 4px; color: #555; }
  input, select { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #ccd; border-radius: 8px;
                  background: #fff; color: #222; }
  .seg { display: flex; gap: 8px; }
  .seg label { flex: 1; margin: 0; border: 1px solid #ccd; border-radius: 8px; padding: 11px; text-align: center;
               color: #333; font-size: 15px; }
  .seg input { display: none; }
  .seg label.on { background: #2f5d50; color: #fff; border-color: #2f5d50; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #555; margin-top: 14px; }
  .consent input { width: auto; margin-top: 3px; }
  .btn { width: 100%; margin-top: 18px; padding: 13px; font-size: 16px; border: 0; border-radius: 10px;
         background: #06c755; color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .btn2 { background:#fff; color:#6e4b45; border:1px solid #d9c3bd; margin-top:4px; }
  .notice { background:#fdf3e6; color:#8a5a1c; border-radius:8px; padding:10px 12px; font-size:14px; margin-top:10px; }
  .err { color: #c0392b; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .ok  { color: #1e8449; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .hint { font-size: 13px; color: #777; margin-top: 6px; }

  .card { border-radius: 16px; padding: 22px 20px 18px; color: #fff; position: relative;
          box-shadow: 0 6px 18px rgba(0,0,0,.18); aspect-ratio: 1.586 / 1; display: flex; flex-direction: column; }
  .card.staff  { background: linear-gradient(135deg, #2f5d50, #1d3a32); }
  .card.rotary { background: linear-gradient(135deg, #17458f, #0d2a5c); }
  .card .brand { font-size: 14px; letter-spacing: 2px; opacity: .85; }
  .card .ctype { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .card .name  { margin-top: auto; font-size: 18px; }
  .card .unit  { font-size: 13px; opacity: .8; }
  .card .no    { font-size: 30px; font-weight: 700; letter-spacing: 6px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  /* 員工卡：玫瑰金卡面圖片，卡號疊在原 EA1001 位置 */
  .card.staff { background: url('card-staff.png?v=2') center / 100% 100% no-repeat, linear-gradient(135deg, #e9c9c1, #cfa197); padding: 0;
                aspect-ratio: 445 / 291; container-type: inline-size; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  /* 扶輪卡：金色卡面圖片，卡號放在 VIP Membership Card 下方 */
  .card.rotary { background: url('card-rotary.jpg?v=2') center / 100% 100% no-repeat, linear-gradient(135deg, #e6d2ae, #c8a874); padding: 0;
                 aspect-ratio: 1404 / 904; container-type: inline-size; border-radius: 3.6cqw;
                 box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .card.staff > :not(.staffNo):not(.badge),
  .card.rotary > :not(.staffNo):not(.badge) { display: none; }
  .staffNo { display: none; }
  .card.staff .staffNo, .card.rotary .staffNo {
                         display: block; position: absolute; left: 5.4%; top: 57.6%;
                         font-size: 5.1cqw; line-height: 1; color: #8e6c65; letter-spacing: .02em;
                         font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 400; }
  .card.rotary .staffNo { left: 5.6%; top: 60%; color: #8a7048; }
  .holder { text-align: center; font-size: 15px; color: #444; margin-top: 12px; }
  .badge { position: absolute; top: 18px; right: 18px; font-size: 12px; padding: 3px 10px; border-radius: 20px;
           background: rgba(255,255,255,.2); }
  .badge.off { background: #f5b301; color: #222; }
  .barcode { background: #fff; border-radius: 12px; margin-top: 16px; padding: 14px; text-align: center; }
  .barcode svg { width: 100%; height: auto; }
  .note { font-size: 13px; color: #666; text-align: center; margin: 10px 0 20px; }
  .loading { text-align: center; padding: 60px 0; color: #777; }
</style>
</head>
<body>
<div class="wrap">
  <h1>沐森集團 會員中心</h1>

  <div id="loading" class="loading">載入中…</div>

  <!-- ===== 第一次：註冊 ===== -->
  <div id="formView" class="panel hidden">
    <h2>會員註冊</h2>
    <div class="hint">請填寫真實資料，完成後即可領取會員卡</div>
    <div id="stoppedNote" class="notice hidden"></div>
    <form id="regForm" novalidate>
      <label>真實姓名</label>
      <input name="name" autocomplete="name">
      <label>手機</label>
      <input name="phone" type="tel" inputmode="numeric" placeholder="0912345678">
      <label>性別</label>
      <div class="seg" data-name="gender">
        <label><input type="radio" name="gender" value="男">男</label>
        <label><input type="radio" name="gender" value="女">女</label>
        <label><input type="radio" name="gender" value="不透露">不透露</label>
      </div>
      <label>出生年月日</label>
      <input name="birthday" type="date" min="1900-01-01">
      <label>Email</label>
      <input name="email" type="email" inputmode="email" autocomplete="email">

      <label>卡別</label>
      <div class="seg" data-name="type">
        <label><input type="radio" name="type" value="員工卡">員工卡</label>
        <label><input type="radio" name="type" value="扶輪卡">扶輪卡</label>
      </div>

      <div id="staffBox" class="hidden">
        <label>員工卡卡號</label>
        <input name="cardNo" autocapitalize="characters" autocomplete="off" placeholder="請輸入實體卡上的卡號">
        <label>任職公司</label>
        <select name="company" class="companySel"></select>
      </div>
      <div id="rotaryBox" class="hidden">
        <label>扶輪社名稱</label>
        <input name="club" placeholder="例如：台北東區扶輪社">
        <div class="hint">扶輪卡卡號將於註冊完成後自動產生</div>
      </div>

      <div class="consent">
        <input type="checkbox" name="consent" id="consent">
        <span>我同意沐森集團依個人資料保護法，蒐集上述資料用於會員身分確認、優惠提供及介紹費計算與發放。</span>
      </div>
      <button class="btn" type="submit">完成註冊</button>
      <div id="regErr" class="err"></div>
    </form>
  </div>

  <!-- ===== 已註冊：會員卡＋補充資料 ===== -->
  <div id="cardView" class="hidden">
    <div id="card" class="card">
      <span id="badge" class="badge"></span>
      <div class="brand">沐森集團 MEMBER</div>
      <div id="cType" class="ctype"></div>
      <div id="cName" class="name"></div>
      <div id="cUnit" class="unit"></div>
      <div id="cNo" class="no"></div>
      <div id="sNo" class="staffNo"></div>
    </div>
    <div id="holder" class="holder"></div>
    <div class="barcode"><svg id="bc"></svg></div>
    <div class="note">結帳時出示此畫面，由櫃台掃描條碼</div>

    <button id="editBtn" class="btn btn2" type="button">修改基本資料</button>
    <div id="profilePanel" class="panel hidden" style="margin-top:14px">
      <h2>修改基本資料</h2>
      <div class="hint">卡號與卡別無法修改，如需更換請洽管理者</div>
      <form id="profileForm" novalidate>
        <label>真實姓名</label>
        <input name="name" autocomplete="name">
        <label>手機</label>
        <input name="phone" type="tel" inputmode="numeric" placeholder="0912345678">
        <label>性別</label>
        <select name="gender">
          <option value="男">男</option><option value="女">女</option><option value="不透露">不透露</option>
        </select>
        <label>出生年月日</label>
        <input name="birthday" type="date" min="1900-01-01">
        <label>Email</label>
        <input name="email" type="email" inputmode="email">
        <div id="pStaff">
          <label>任職公司</label>
          <select name="company" class="companySel"></select>
        </div>
        <div id="pRotary">
          <label>扶輪社名稱</label>
          <input name="club">
        </div>
        <button class="btn" type="submit">儲存基本資料</button>
        <button id="cancelEdit" class="btn btn2" type="button">取消</button>
        <div id="profileMsg" class="err"></div>
      </form>
    </div>
    <div style="height:16px"></div>

    <div class="panel">
      <h2>補充資料</h2>
      <div class="hint">介紹費匯款使用，可隨時修改</div>
      <form id="extraForm">
        <label>通訊地址</label>
        <input name="address" autocomplete="street-address">
        <label>匯款銀行名稱</label>
        <input name="bank" placeholder="例如：台灣銀行（004）">
        <label>分行</label>
        <input name="branch" placeholder="例如：信義分行">
        <label>匯款帳號</label>
        <input name="account" inputmode="numeric">
        <label>戶名</label>
        <input name="holder">
        <button class="btn" type="submit">儲存</button>
        <div id="extraMsg" class="ok"></div>
      </form>
    </div>
  </div>
</div>

<script>
  // ====== 部署前要改的值 ======
  const LIFF_ID = '2012800973-voOwiMMB';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxd4TJUev1NthX9UgOXef1LFwa9a_k9mE0DIF42Fo12E-6GfeWqWYV3rYdZLH3DZ4-coQ/exec';
  // ============================

  const $ = id => document.getElementById(id);
  let idToken = '';
  let me = null;

  // 員工卡任職公司（要和 LineMember.gs 的 COMPANIES 一致）
  const COMPANIES = ['寵之寶動物醫院', '禾和國際法律事務所', '久大文具連鎖', '上禾醫務管理顧問有限公司',
                     '上圓預防醫學健康管理診所', '財團法人流浪動物之家基金會', '萬通國際租賃股份有限公司',
                     '酒大居酒屋'];
  document.querySelectorAll('.companySel').forEach(sel => {
    sel.innerHTML = '<option value="">請選擇</option>' +
      COMPANIES.map(c => '<option value="' + c + '">' + c + '</option>').join('');
  });

  async function api(action, data) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS 預檢
      body: JSON.stringify({ source: 'liff', action, idToken, data }),
    });
    return res.json();
  }

  function show(view) {
    ['loading', 'formView', 'cardView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
  }

  function showCard(m) {
    me = m;
    $('profilePanel').classList.add('hidden');
    $('editBtn').classList.remove('hidden');
    $('card').className = 'card ' + (m.type === '扶輪卡' ? 'rotary' : 'staff');
    $('cType').textContent = m.type;
    $('cName').textContent = m.name;
    $('cUnit').textContent = m.unit || '';
    $('cNo').textContent = m.cardNo;
    $('sNo').textContent = m.cardNo;
    $('holder').textContent = m.name + (m.unit ? '．' + m.unit : '');
    const active = m.status === '啟用';
    $('badge').textContent = active ? '已啟用' : (m.status || '未啟用');
    $('badge').className = 'badge' + (active ? '' : ' off');
    // 員工卡卡面上不放「已啟用」標籤，只在非啟用狀態時提示
    $('badge').classList.toggle('hidden', active);
    JsBarcode('#bc', m.cardNo, { format: 'CODE128', width: 3, height: 70, fontSize: 18, margin: 0 });
    const f = $('extraForm');
    ['address', 'bank', 'branch', 'account', 'holder'].forEach(k => { f.elements[k].value = m[k] || ''; });
    show('cardView');
  }

  // 性別／卡別按鈕樣式
  document.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('change', () => {
      seg.querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
      if (seg.dataset.name === 'type') {
        const t = seg.querySelector('input:checked').value;
        $('staffBox').classList.toggle('hidden', t !== '員工卡');
        $('rotaryBox').classList.toggle('hidden', t !== '扶輪卡');
      }
    });
  });

  $('regForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button');
    const data = Object.fromEntries(new FormData(f).entries());
    data.consent = f.elements.consent.checked;
    $('regErr').textContent = '';
    btn.disabled = true;
    try {
      const r = await api('register', data);
      if (r.ok && r.member) showCard(r.member);
      else $('regErr').textContent = r.error || '送出失敗';
    } catch (err) {
      $('regErr').textContent = '連線失敗，請稍後再試';
    } finally { btn.disabled = false; }
  };

  $('extraForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button'), msg = $('extraMsg');
    msg.textContent = ''; msg.className = 'ok';
    btn.disabled = true;
    try {
      const r = await api('update', Object.fromEntries(new FormData(f).entries()));
      if (r.ok) { msg.textContent = '已儲存'; showCard(r.member); }
      else { msg.className = 'err'; msg.textContent = r.error || '儲存失敗'; }
    } catch (err) {
      msg.className = 'err'; msg.textContent = '連線失敗，請稍後再試';
    } finally { btn.disabled = false; }
  };

  $('editBtn').onclick = () => {
    const f = $('profileForm');
    ['name', 'phone', 'gender', 'birthday', 'email'].forEach(k => { f.elements[k].value = me[k] || ''; });
    const staff = me.type === '員工卡';
    $('pStaff').classList.toggle('hidden', !staff);
    $('pRotary').classList.toggle('hidden', staff);
    f.elements.company.value = staff ? (me.unit || '') : '';
    f.elements.club.value = staff ? '' : (me.unit || '');
    $('profileMsg').textContent = '';
    $('profilePanel').classList.remove('hidden');
    $('editBtn').classList.add('hidden');
    $('profilePanel').scrollIntoView({ behavior: 'smooth' });
  };
  $('cancelEdit').onclick = () => {
    $('profilePanel').classList.add('hidden');
    $('editBtn').classList.remove('hidden');
  };
  $('profileForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button[type=submit]');
    $('profileMsg').textContent = '';
    btn.disabled = true;
    try {
      const r = await api('profile', Object.fromEntries(new FormData(f).entries()));
      if (r.ok) { showCard(r.member); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      else $('profileMsg').textContent = r.error || '儲存失敗';
    } catch (err) {
      $('profileMsg').textContent = '連線失敗，請稍後再試';
    } finally { btn.disabled = false; }
  };

  (async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      idToken = liff.getIDToken();
      const r = await api('me');
      if (!r.ok) { show('formView'); $('regErr').textContent = r.error; return; }
      if (r.bound) { showCard(r.member); return; }
      if (r.stopped && r.stopped.length) {
        const s = r.stopped[r.stopped.length - 1];
        $('stoppedNote').textContent = '您原本的' + s.type + '（' + s.cardNo + '）已停用，可以重新註冊新的會員卡。';
        $('stoppedNote').classList.remove('hidden');
      }
      show('formView');
    } catch (err) {
      $('loading').textContent = '載入失敗：' + err.message;
    }
  })();
</script>
</body>
</html>
